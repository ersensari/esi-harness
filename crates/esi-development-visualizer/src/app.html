<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESI Development Run</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: var(--color-background-primary, light-dark(#f4f1ea, #171918));
      --panel: var(--color-background-secondary, light-dark(#fffefb, #212422));
      --ink: var(--color-text-primary, light-dark(#18201c, #f1f4ef));
      --muted: var(--color-text-secondary, light-dark(#647069, #aab4ad));
      --line: var(--color-border-default, light-dark(#d8d8d0, #3b403c));
      --accent: light-dark(#006d5b, #62d4b7);
      --warning: light-dark(#a05a00, #f3b35b);
      --danger: light-dark(#b42318, #ff8a80);
      --success: light-dark(#287a3d, #7bd88f);
      --mono: "Berkeley Mono", "IBM Plex Mono", ui-monospace, monospace;
      --sans: "IBM Plex Sans", "Avenir Next", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 280px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--line) 28%, transparent) 1px, transparent 1px),
        var(--surface);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }
    main { max-width: 1160px; margin: 0 auto; padding: 20px; }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      padding: 4px 0 18px;
      border-bottom: 2px solid var(--ink);
    }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font: 700 11px/1.2 var(--mono); text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(22px, 4vw, 36px); line-height: 1; font-weight: 750; overflow-wrap: anywhere; }
    #objective { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .status { padding: 8px 11px; border: 1px solid currentColor; font: 700 12px/1 var(--mono); text-transform: uppercase; }
    .status[data-state="completed"] { color: var(--success); }
    .status[data-state="failed"], .status[data-state="abandoned"] { color: var(--danger); }
    .status[data-state="blocked"] { color: var(--warning); }
    .stage-strip { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 2px; }
    .stage {
      flex: 0 0 auto;
      padding: 7px 9px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font: 600 11px/1 var(--mono);
    }
    .stage:last-child { border-color: var(--accent); color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 12px; margin-top: 14px; }
    section { min-width: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 94%, transparent); padding: 14px; }
    section.wide { grid-column: 1 / -1; }
    h2 { display: flex; justify-content: space-between; margin: 0 0 11px; font-size: 13px; text-transform: uppercase; }
    .count { color: var(--muted); font: 500 11px var(--mono); }
    dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 12px; }
    dt { color: var(--muted); } dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
    ul { list-style: none; margin: 0; padding: 0; }
    li + li { margin-top: 7px; }
    .row { padding: 9px; border-left: 3px solid var(--line); background: color-mix(in srgb, var(--surface) 68%, transparent); }
    .row.passed, .row.completed { border-color: var(--success); }
    .row.failed { border-color: var(--danger); }
    .row.pending { border-color: var(--warning); }
    .row-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; }
    .row-meta, .detail { margin-top: 4px; color: var(--muted); font: 11px/1.45 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; }
    .budget { display: grid; grid-template-columns: minmax(90px, 1fr) 2fr auto; gap: 8px; align-items: center; font-size: 12px; }
    .track { height: 5px; background: var(--line); }
    .fill { height: 100%; background: var(--accent); }
    .files { columns: 2; column-gap: 18px; font: 11px/1.55 var(--mono); }
    .files li { break-inside: avoid; overflow-wrap: anywhere; }
    .empty { padding: 22px 8px; color: var(--muted); text-align: center; font-size: 13px; }
    code { font-family: var(--mono); }
    @media (max-width: 720px) {
      main { padding: 14px; }
      header, .grid { grid-template-columns: 1fr; }
      .status { justify-self: start; }
      section.wide { grid-column: auto; }
      .files { columns: 1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Local deterministic workflow</p><h1 id="run-title">No active run</h1><p id="objective">Waiting for persisted controller state.</p></div>
      <div id="status" class="status" data-state="empty">Empty</div>
    </header>
    <div id="stage-history" class="stage-strip" aria-label="Stage history"></div>
    <div class="grid">
      <section id="worktree-panel"><h2>Worktree</h2><div id="worktree" class="empty">No worktree bound.</div></section>
      <section id="repair-panel"><h2>Repair budgets <span id="repair-count" class="count">0</span></h2><ul id="repair-budgets"></ul></section>
      <section class="wide" id="changed-files-panel"><h2>Changed files <span id="file-count" class="count">0</span></h2><ul id="changed-files" class="files"></ul></section>
      <section class="wide" id="validation-panel"><h2>Validation evidence <span id="validation-count" class="count">0</span></h2><ul id="validation-evidence"></ul></section>
      <section id="fingerprint-panel"><h2>Fingerprints <span id="fingerprint-count" class="count">0</span></h2><ul id="fingerprints"></ul></section>
      <section id="approval-panel"><h2>Approvals <span id="approval-count" class="count">0</span></h2><ul id="approvals"></ul></section>
      <section class="wide" id="event-panel"><h2>Controller events <span id="event-count" class="count">0</span></h2><ul id="events"></ul></section>
    </div>
  </main>
  <script>
    (() => {
      "use strict";
      let requestId = 1;
      const byId = (id) => document.getElementById(id);
      const text = (tag, value, className) => { const node = document.createElement(tag); node.textContent = value; if (className) node.className = className; return node; };
      const empty = (list, message) => list.appendChild(text("li", message, "empty"));
      const renderList = (id, items, renderer, message) => { const list = byId(id); list.replaceChildren(); items.length ? items.forEach((item) => list.appendChild(renderer(item))) : empty(list, message); };
      const row = (title, state, meta, detail) => { const item = text("li", "", `row ${state || ""}`); const head = text("div", "", "row-head"); head.append(text("span", title), text("span", state || "")); item.append(head); if (meta) item.append(text("div", meta, "row-meta")); if (detail) item.append(text("div", detail, "detail")); return item; };

      function render(data) {
        if (!data || !data.status) return;
        byId("run-title").textContent = data.run_id || "No active run";
        byId("objective").textContent = data.objective || "Waiting for persisted controller state.";
        byId("status").textContent = data.status;
        byId("status").dataset.state = data.status;
        renderList("stage-history", data.stage_history || [], (item) => text("span", item.stage.replaceAll("_", " "), "stage"), "No stage history.");

        const worktree = byId("worktree");
        worktree.replaceChildren();
        if (data.worktree) {
          const details = document.createElement("dl");
          [["Repository", data.worktree.repository_id], ["Session", data.worktree.session_id], ["Branch", data.worktree.branch], ["Path", data.worktree.worktree_path], ["Head", data.worktree.head], ["Snapshot", data.worktree.snapshot_id]].forEach(([key, value]) => details.append(text("dt", key), text("dd", value)));
          worktree.className = ""; worktree.append(details);
        } else { worktree.className = "empty"; worktree.textContent = "No worktree bound."; }

        const files = data.worktree?.changed_files || [];
        byId("file-count").textContent = files.length;
        renderList("changed-files", files, (file) => text("li", file), "No changed files captured.");
        byId("validation-count").textContent = data.validation_evidence.length;
        renderList("validation-evidence", data.validation_evidence, (item) => row(item.validator_id, item.outcome, `attempt ${item.attempt} · ${item.category} · exit ${item.exit_code ?? "n/a"}`, [item.command.join(" "), item.output].filter(Boolean).join("\n")), "No validation evidence yet.");
        byId("fingerprint-count").textContent = data.fingerprints.length;
        renderList("fingerprints", data.fingerprints, (item) => row(item.category || "failure", item.occurrences > 1 ? "repeated" : "recorded", `${item.occurrences} occurrence(s) · ${item.source_id || "unknown source"}`, `${item.fingerprint}\n${item.summary || ""}`), "No failure fingerprints.");
        byId("repair-count").textContent = data.repair_budgets.length;
        renderList("repair-budgets", data.repair_budgets, (item) => { const li = text("li", "", "budget"); const total = item.base_budget + item.extensions; const track = text("div", "", "track"); const fill = text("div", "", "fill"); fill.style.width = `${total ? Math.min(100, item.attempts / total * 100) : 100}%`; track.append(fill); li.append(text("span", item.category), track, text("code", `${item.remaining} left`)); return li; }, "No repair budgets.");
        byId("approval-count").textContent = data.approvals.length;
        renderList("approvals", data.approvals, (item) => row(item.gate_id, item.state, item.approved_by ? `by ${item.approved_by}` : "human action required", item.summary), "No approvals recorded or pending.");
        byId("event-count").textContent = data.events.length;
        renderList("events", data.events, (item) => row(`#${item.sequence} ${item.kind}`, "", item.stage, item.detail), "No controller events.");
        queueMicrotask(reportSize);
      }

      function post(method, params, id) { window.parent.postMessage({ jsonrpc: "2.0", ...(id ? { id } : {}), method, params }, "*"); }
      function reportSize() { post("ui/notifications/size-changed", { width: document.body.scrollWidth, height: document.documentElement.scrollHeight }); }
      window.addEventListener("message", (event) => {
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.method === "ui/notifications/tool-result") render(message.params?.structuredContent);
        if (message.method === "ui/notifications/host-context-changed") {
          const context = message.params || {};
          if (context.theme) document.documentElement.style.colorScheme = context.theme;
          Object.entries(context.styles?.variables || {}).forEach(([key, value]) => value && document.documentElement.style.setProperty(key, value));
        }
        if (message.method === "ui/resource-teardown" && message.id) window.parent.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
        if (message.id === requestId) { post("ui/notifications/initialized", {}); reportSize(); }
      });
      new ResizeObserver(reportSize).observe(document.body);
      post("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "esi-development-visualizer", version: "1.0.0" }, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] } }, requestId);
    })();
  </script>
</body>
</html>
